<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="gradRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="100%" stop-color="#FFB199"/>
    </linearGradient>
  </defs>
  <rect width="560" height="220" rx="16" fill="#0B132B"/>
  
  <g transform="translate(45, 45)">
    <!-- Colorful Ring -->
    <circle cx="65" cy="65" r="54" fill="none" stroke="url(#gradRing)" stroke-width="5"/>
    
    <!-- Vibrant Interlocking RC Monogram -->
    <path d="M 38 95 L 38 35 C 38 25 58 25 68 40 C 78 25 95 30 95 50 C 95 72 78 80 62 80 L 38 80 M 62 80 L 92 100" fill="none" stroke="url(#gradRC)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="95" cy="50" r="5" fill="#00F2FE"/>
  </g>
  
  <!-- Brand Name -->
  <text x="195" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">
    rough<tspan fill="#00F2FE">click</tspan>
  </text>
  
  <!-- PROMINENT TAGLINE -->
  <text x="197" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#FFB199">
    "Click to Code, Vision to Value"
  </text>
  
  <text x="197" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94A3B8" letter-spacing="3">
    DIGITAL MARKETING AGENCY
  </text>
</svg>
