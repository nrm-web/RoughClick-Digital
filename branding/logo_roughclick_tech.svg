<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
  <rect width="600" height="180" rx="12" fill="#0F172A"/>
  
  <!-- Icon Symbol: Modern Cursor + Code Bracket -->
  <g transform="translate(40, 30)">
    <!-- Outer Glow Circle -->
    <circle cx="60" cy="60" r="54" fill="#1E293B" stroke="#3B82F6" stroke-width="2.5"/>
    
    <!-- Code Brackets -->
    <path d="M42 42 L25 60 L42 78" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 42 L95 60 L78 78" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Tech Cursor Accent -->
    <path d="M60 32 L68 70 L58 62 L48 76 L42 72 L52 58 L42 56 Z" fill="#2563EB"/>
  </g>
  
  <!-- Typography -->
  <text x="180" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#FFFFFF" letter-spacing="0.5">
    ROUGH<tspan fill="#3B82F6">CLICK</tspan>
  </text>
  <text x="182" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#94A3B8" letter-spacing="4">
    TECH &amp; DIGITAL LABS
  </text>
  <text x="182" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-style="italic" font-size="13" fill="#60A5FA">
    "Click to Code, Vision to Value"
  </text>
</svg>
