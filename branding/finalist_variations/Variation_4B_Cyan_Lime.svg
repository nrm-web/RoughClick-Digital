<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="fluidGrad_cyan_lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="fluidGlow_cyan_lime" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00D2FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="20" fill="#FFFFFF"/>

  <!-- LOGO 4 EMBLEM: Kinetic Fluid Ribbon RC with Coding Bracket < -->
  <g transform="translate(240, 100) scale(1.05)" filter="url(#fluidGlow_cyan_lime)">
    <!-- R STEM -->
    <path d="M 0 0 L 45 0 L 45 200 L 0 200 Z" fill="url(#fluidGrad_cyan_lime)"/>
    
    <!-- R LOOP & FLUID CURVE -->
    <path d="M 45 0 L 130 0 C 175 0 195 25 195 55 C 195 85 170 110 125 110 L 45 110 L 45 70 L 120 70 C 145 70 150 55 150 55 C 150 55 145 40 120 40 L 45 40 Z" fill="url(#fluidGrad_cyan_lime)"/>
    
    <!-- R DIAGONAL LEG FORMING CODE BRACKET < -->
    <path d="M 45 110 L 100 110 L 165 155 L 130 190 L 75 145 L 45 145 Z" fill="url(#fluidGrad_cyan_lime)"/>
    <path d="M 100 110 L 140 110 L 205 200 L 150 200 Z" fill="url(#fluidGrad_cyan_lime)"/>

    <!-- C FLUID RIBBON -->
    <path d="M 185 30 C 235 15 285 45 295 90 L 250 100 C 245 75 220 55 190 65 Z" fill="url(#fluidGrad_cyan_lime)"/>
    <path d="M 295 90 C 305 140 265 190 205 200 L 195 160 C 230 150 255 125 250 100 Z" fill="url(#fluidGrad_cyan_lime)"/>
  </g>

  <!-- WORDMARK: ROUGHCLICK -->
  <text x="400" y="440" 
        font-family="'Montserrat', 'Inter', Arial, sans-serif" 
        font-size="46" 
        font-weight="900" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#0A192F">ROUGHCLICK</text>

  <!-- MASTER TAGLINE: IDEAS IN MOTION -->
  <text x="400" y="485" 
        font-family="'Inter', Arial, sans-serif" 
        font-size="18" 
        font-weight="700" 
        letter-spacing="8" 
        text-anchor="middle" 
        fill="#64748B">IDEAS IN MOTION</text>
        
  <circle cx="400" cy="515" r="3.5" fill="#00D2FF"/>
</svg>