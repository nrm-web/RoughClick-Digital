<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D2FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#0B0F19"/>

  <!-- EMBLEM GROUP (Centered at X=400, Y=175) -->
  <g transform="translate(240, 60)">
    <!-- R STEM & LOOP (Deep Solid Base) -->
    <!-- Left vertical bar of R -->
    <path d="M 0 0 L 40 0 L 40 210 L 0 210 Z" fill="#FFFFFF"/>
    
    <!-- Top horizontal of R loop with 45-deg chamfer -->
    <path d="M 40 0 L 130 0 L 170 40 L 170 85 L 140 115 L 40 115 L 40 75 L 130 75 L 130 40 L 40 40 Z" fill="#FFFFFF"/>
    
    <!-- R Diagonal Leg shooting down-right at 45 deg -->
    <path d="M 40 115 L 90 115 L 175 210 L 120 210 Z" fill="#FFFFFF"/>

    <!-- C SHAPE (Interlocking Right Side with 45-deg chamfers) -->
    <!-- C Upper Roof -->
    <path d="M 195 0 L 310 0 L 310 40 L 225 40 L 165 100 L 195 100 L 255 40 L 255 0 Z" fill="#FFFFFF"/>
    
    <!-- C Back & Lower Floor -->
    <path d="M 230 110 L 140 210 L 225 210 L 310 210 L 310 170 L 225 170 L 180 120 L 230 110 Z" fill="#FFFFFF"/>
    <path d="M 225 170 L 310 170 L 310 210 L 225 210 Z" fill="#FFFFFF"/>

    <!-- EMBEDDED ACCENT CHEVRON / CODING BRACKET < (The 'Ideas in Motion' / Click Spark) -->
    <path d="M 140 90 L 175 125 L 140 160 L 120 140 L 145 125 L 120 110 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
    
    <!-- Accent Line Accent Stripe along the 45-deg inner path -->
    <path d="M 175 40 L 188 53 L 130 115 L 117 102 Z" fill="#00D2FF"/>
  </g>

  <!-- WORDMARK: ROUGHCLICK -->
  <text x="400" y="360" 
        font-family="'Montserrat', 'Inter', 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#FFFFFF">ROUGHCLICK</text>

  <!-- MASTER TAGLINE: Ideas in Motion -->
  <text x="400" y="405" 
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
        font-size="18" 
        font-weight="600" 
        letter-spacing="8" 
        text-anchor="middle" 
        fill="#94A3B8">IDEAS IN MOTION</text>

  <!-- Subtle Bottom Brand Accent Dot -->
  <circle cx="400" cy="435" r="3.5" fill="#00D2FF"/>
</svg>