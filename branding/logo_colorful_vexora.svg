<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="100%" height="100%">
  <defs>
    <linearGradient id="gradSunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="50%" stop-color="#F09819"/>
      <stop offset="100%" stop-color="#FF8008"/>
    </linearGradient>
    <linearGradient id="gradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E100FF"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
  </defs>
  <rect width="560" height="220" rx="16" fill="#12091F"/>
  
  <g transform="translate(45, 45)">
    <!-- Colorful Sunset Circle Badge -->
    <circle cx="65" cy="65" r="54" fill="none" stroke="url(#gradSunset)" stroke-width="5"/>
    
    <!-- Bold Colorful V Monogram -->
    <path d="M 32 38 L 65 98 L 98 38" fill="none" stroke="url(#gradV)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 48 38 L 65 72 L 82 38" fill="none" stroke="#F09819" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Brand Name -->
  <text x="195" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="1">
    VEXORA<tspan fill="#FF512F"> MEDIA</tspan>
  </text>
  
  <!-- PROMINENT TAGLINE -->
  <text x="197" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#F09819">
    "High-Impact Digital Marketing &amp; Media"
  </text>
  
  <text x="197" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#C4B5FD" letter-spacing="3">
    DIGITAL GROWTH STUDIO
  </text>
</svg>
