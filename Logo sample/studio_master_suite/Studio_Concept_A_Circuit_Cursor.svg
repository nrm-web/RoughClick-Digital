<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00D2FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="#FFFFFF"/>

  <!-- EMBLEM: STUDIO EVOLUTION OF CLIENT REF 2 (CIRCUIT & CURSOR) -->
  <g transform="translate(320, 120)">
    <!-- R SHAPE (Deep Midnight Navy #0A192F) -->
    <!-- Left Stem -->
    <path d="M 0 0 L 48 0 L 48 240 L 0 240 Z" fill="#0A192F"/>
    <!-- Top Loop with 45-deg Chamfer -->
    <path d="M 48 0 L 150 0 L 200 50 L 200 95 L 165 130 L 48 130 L 48 85 L 145 85 L 160 70 L 160 55 L 135 45 L 48 45 Z" fill="#0A192F"/>
    <!-- Diagonal Leg -->
    <path d="M 48 130 L 105 130 L 205 240 L 140 240 Z" fill="#0A192F"/>

    <!-- C SHAPE (Opening to the RIGHT) -->
    <!-- Top Roof -->
    <path d="M 235 0 L 360 0 L 360 48 L 275 48 L 205 120 L 245 120 L 305 48 Z" fill="#0A192F"/>
    <!-- Vertical Spine & Lower Floor -->
    <path d="M 275 192 L 360 192 L 360 240 L 235 240 L 175 175 L 215 175 L 260 220 L 315 220 L 275 192 Z" fill="#0A192F"/>
    <path d="M 235 240 L 360 240 L 360 192 L 275 192 Z" fill="#0A192F"/>

    <!-- ELECTRIC CYAN CIRCUIT TRACE (From R Crossbar to C Apex) -->
    <path d="M 0 130 L 75 130 L 195 24 L 270 24 L 270 42 L 205 42 L 95 145 L 0 145 Z" fill="url(#cyanGrad)" filter="url(#glow)"/>

    <!-- MOUSE CURSOR CLICK POINTER AT APEX OF C -->
    <g transform="translate(265, 0) scale(1.1)" filter="url(#glow)">
      <polygon points="0,0 28,32 15,33 22,50 14,54 7,37 -4,45" fill="#00D2FF" stroke="#0A192F" stroke-width="2"/>
    </g>
  </g>

  <!-- TYPOGRAPHY: ROUGHCLICK -->
  <text x="500" y="530" font-family="'Montserrat', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="8" text-anchor="middle" fill="#0A192F">ROUGHCLICK</text>

  <!-- MASTER TAGLINE -->
  <text x="500" y="585" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="10" text-anchor="middle" fill="#64748B">IDEAS IN MOTION</text>

  <circle cx="500" cy="625" r="4" fill="#00D2FF"/>
</svg>