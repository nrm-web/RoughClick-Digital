<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <linearGradient id="fluidRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glowFluid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0066FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="#FFFFFF"/>

  <!-- EMBLEM: STUDIO EVOLUTION OF LOGO 4 (KINETIC FLUID RIBBON) -->
  <g transform="translate(320, 120)" filter="url(#glowFluid)">
    <!-- R FLUID RIBBON -->
    <rect x="0" y="0" width="50" height="240" rx="25" fill="url(#fluidRibbonGrad)"/>
    <path d="M 50 0 L 140 0 C 185 0 210 28 210 65 C 210 102 180 130 135 130 L 50 130 L 50 82 L 130 82 C 155 82 160 70 160 65 C 160 60 155 48 130 48 L 50 48 Z" fill="url(#fluidRibbonGrad)"/>
    <path d="M 50 130 L 115 130 L 210 240 L 145 240 Z" fill="url(#fluidRibbonGrad)"/>

    <!-- C FLUID RIBBON (Opening to the RIGHT) -->
    <path d="M 215 35 C 275 15 340 50 350 100 L 298 112 C 292 82 260 60 220 72 Z" fill="url(#fluidRibbonGrad)"/>
    <path d="M 350 100 C 360 155 315 210 245 220 L 235 172 C 275 162 305 135 298 112 Z" fill="url(#fluidRibbonGrad)"/>

    <!-- Speed Chevron Accent < -->
    <path d="M 175 90 L 140 120 L 175 150 L 192 133 L 168 120 L 192 107 Z" fill="#00E5FF"/>
  </g>

  <!-- TYPOGRAPHY: ROUGHCLICK -->
  <text x="500" y="530" font-family="'Montserrat', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="8" text-anchor="middle" fill="#0A192F">ROUGHCLICK</text>

  <!-- MASTER TAGLINE -->
  <text x="500" y="585" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="10" text-anchor="middle" fill="#64748B">IDEAS IN MOTION</text>

  <circle cx="500" cy="625" r="4" fill="#0066FF"/>
</svg>