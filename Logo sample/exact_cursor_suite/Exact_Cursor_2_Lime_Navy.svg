<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="#FFFFFF"/>

  <!-- EXACT GEOMETRIC RC FROM CLIENT REFERENCE IMAGE -->
  <g transform="translate(260, 100)" filter="url(#shadow)">
    <!-- 1. BASE OUTLINE FRAME (Letter R & Letter C) -->
    <!-- R Stem Left -->
    <path d="M 0 0 L 32 0 L 32 300 L 0 300 Z" fill="#0A192F"/>
    
    <!-- R Top Loop -->
    <path d="M 0 0 L 150 0 L 210 60 L 210 110 L 150 170 L 32 170 L 32 138 L 140 138 L 180 98 L 180 72 L 138 32 L 32 32 Z" fill="#0A192F"/>
    
    <!-- R Bottom Diagonal Leg & Floor -->
    <path d="M 32 138 L 80 138 L 205 268 L 205 300 L 160 300 L 32 170 Z" fill="#0A192F"/>
    <path d="M 160 300 L 240 300 L 240 268 L 185 268 Z" fill="#0A192F"/>

    <!-- C Top Arm & Chamfer (Opening RIGHT) -->
    <path d="M 240 0 L 390 0 L 440 50 L 440 90 L 408 90 L 380 62 L 380 32 L 270 32 L 210 92 L 210 60 Z" fill="#0A192F"/>
    
    <!-- C Diagonal Spine & Bottom Arm -->
    <path d="M 270 268 L 380 268 L 440 208 L 440 248 L 390 300 L 240 300 L 210 268 L 240 268 Z" fill="#0A192F"/>
    <path d="M 210 92 L 240 60 L 300 120 L 300 152 L 240 92 Z" fill="#0A192F"/>
    <path d="M 210 236 L 240 268 L 300 208 L 300 176 L 240 236 Z" fill="#0A192F"/>
    <path d="M 300 120 L 300 208 L 268 208 L 268 120 Z" fill="#0A192F"/>

    <!-- 2. THE SIGNATURE CIRCUIT PATH (Orange / Cyan / Lime) -->
    <!-- Horizontal through R crossbar -->
    <path d="M 0 138 L 95 138 L 225 268 L 245 268 L 245 284 L 215 284 L 85 154 L 0 154 Z" fill="#10B981"/>
    <!-- Diagonal up through C spine -->
    <path d="M 140 170 L 270 40 L 375 40 L 375 56 L 280 56 L 150 186 Z" fill="#10B981"/>
    <!-- Horizontal top inside arm of C -->
    <path d="M 280 40 L 390 40 L 390 56 L 280 56 Z" fill="#10B981"/>

    <!-- 3. MOUSE CURSOR CLICK POINTER ARROW (At top right tip of C) -->
    <g transform="translate(385, 45)">
      <polygon points="0,0 42,38 22,40 32,62 20,68 10,46 -4,56" fill="#0A192F" stroke="#FFFFFF" stroke-width="3"/>
    </g>
  </g>

  <!-- TYPOGRAPHY: ROUGHCLICK -->
  <text x="500" y="580" font-family="'Montserrat', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="8" text-anchor="middle" fill="#0A192F">ROUGHCLICK</text>

  <!-- MASTER TAGLINE: IDEAS IN MOTION -->
  <text x="500" y="640" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="10" text-anchor="middle" fill="#64748B">IDEAS IN MOTION</text>

  <circle cx="500" cy="685" r="4.5" fill="#10B981"/>
</svg>