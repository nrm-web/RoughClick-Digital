<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .logo-title { font-family: 'Montserrat', 'Inter', 'Plus Jakarta Sans', sans-serif; font-weight: 900; letter-spacing: 7px; text-anchor: middle; }
      .logo-tagline { font-family: 'Inter', 'Plus Jakarta Sans', sans-serif; font-weight: 700; letter-spacing: 9px; text-anchor: middle; }
    </style>
  </defs>

  <!-- EXACT RC INTERLOCK EMBLEM (Colors adapted: Ivory #F7F3EA + Gold #C9A227) -->
  <g transform="translate(325, 60)">
    <!-- R SOLID -->
    <path d="M 0 0 L 52 0 L 52 240 L 0 240 Z" fill="#F7F3EA"/>
    <path d="M 52 0 L 150 0 C 195 0 215 30 215 65 C 215 100 190 130 145 130 L 52 130 L 52 82 L 140 82 C 160 82 165 72 165 65 C 165 58 160 48 140 48 L 52 48 Z" fill="#F7F3EA"/>
    <path d="M 52 130 L 115 130 L 210 240 L 145 240 Z" fill="#F7F3EA"/>

    <!-- C SOLID -->
    <path d="M 230 35 C 295 35 345 75 345 120 C 345 165 295 205 230 205 L 175 205 L 205 160 L 230 160 C 265 160 295 140 295 120 C 295 100 265 80 230 80 L 195 80 L 170 35 Z" fill="#F7F3EA"/>

    <!-- EMBEDDED CODING BRACKET < > (Gold #C9A227) -->
    <path d="M 175 90 L 140 120 L 175 150 L 192 133 L 168 120 L 192 107 Z" fill="#C9A227"/>
    <circle cx="195" cy="120" r="5" fill="#C9A227"/>
  </g>

  <!-- TYPOGRAPHY: ROUGHCLICK DIGITAL -->
  <text x="500" y="470" font-size="52" fill="#F7F3EA" class="logo-title">ROUGHCLICK <tspan fill="#C9A227">DIGITAL</tspan></text>

  <!-- TAGLINE: IDEAS IN MOTION -->
  <text x="500" y="530" font-size="20" fill="#6B6255" class="logo-tagline">IDEAS IN MOTION</text>

  <circle cx="500" cy="570" r="4" fill="#C9A227"/>
</svg>
